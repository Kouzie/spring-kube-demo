pluginManagement {
    plugins {
        id 'org.springframework.boot' version "${springBootVersion}"
        id 'io.spring.dependency-management' version "${dependencyManagementVersion}"
        id 'com.google.cloud.tools.jib' version "${jibVersion}"
    }
    repositories {
        mavenCentral()
        gradlePluginPortal()
        google()
    }
}

rootProject.name = 'spring-kube-demo'
include ':api:calculating'
include ':api:greeting'
include ':api:region'
include ':api:user'
include 'common'
include 'api'
include 'monitoring'
